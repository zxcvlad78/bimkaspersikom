[workspace]
members = ["vehicle-core", "godot-vehicle"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["bimkaspersikom"]

[workspace.dependencies]
glam = { version = "0.34", default-features = false, features = ["std"] }

# Профиль релиза: максимальная производительность физики.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
panic = "unwind"

# Профиль для профайлинга.
[profile.profiling]
inherits = "release"
debug = true
strip = false
